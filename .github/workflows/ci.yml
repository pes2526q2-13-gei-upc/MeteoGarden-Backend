name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: isort (check)
        run: python -m isort . --check-only --diff

      - name: black (check)
        run: python -m black . --check

      - name: flake8
        run: python -m flake8

  sonarcloud:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=pes2526q2-13-gei-upc_MeteoGarden-Backend
            -Dsonar.organization=pes2526q2-13-gei-upc
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/.venv/**,**/venv/**
            -Dsonar.coverage.exclusions=**/migrations/**,**/tests/**
            -Dsonar.cpd.exclusions=**/migrations/**