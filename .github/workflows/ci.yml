name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meteogarden-backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tools
        run: |
          pip install --upgrade pip
          pip install --only-binary :all: black==26.3.0 isort==8.0.1 flake8==7.3.0

      - name: isort (check)
        run: python -m isort . --check-only --diff

      - name: black (check)
        run: python -m black . --check

      - name: flake8
        run: python -m flake8

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meteogarden_test
          POSTGRES_USER: meteogarden
          POSTGRES_PASSWORD: test-db-secret
        options: >-
          --health-cmd "pg_isready -U meteogarden -d meteogarden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_SECRET_KEY: ci-only-dummy-secret-key
      DJANGO_DB_PASSWORD: test-db-secret
      DEBUG: "False"
      POSTGRES_DB: meteogarden_test
      POSTGRES_USER: meteogarden
      POSTGRES_PASSWORD: test-db-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --only-binary :all: pytest==9.0.3 pytest-django==4.12.0 coverage==7.13.5

      - name: Django check
        run: python manage.py check

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=pes2526q2-13-gei-upc_MeteoGarden-Backend
            -Dsonar.organization=pes2526q2-13-gei-upc
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/tests/**,**/.github/workflows/**,**/__pycache__/**,**/.venv/**,**/venv/**
            -Dsonar.coverage.exclusions=**/migrations/**,**/tests/**
            -Dsonar.cpd.exclusions=**/migrations/**,**/tests/**
            -Dsonar.python.coverage.reportPaths=coverage.xml

  build-and-push:
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build & Push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker compose -f /opt/meteogarden/docker-compose.prod.yml pull
            docker compose -f /opt/meteogarden/docker-compose.prod.yml up -d
