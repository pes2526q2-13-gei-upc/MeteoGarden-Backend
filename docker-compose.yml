volumes:
  pgdata:

services:
  pg:
    image: postgres:16-alpine
    container_name: meteogarden_pg
    restart: unless-stopped
    env_file:
      - .postgres.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteogarden_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .django.env
    depends_on:
      pg:
          condition: service_healthy
    volumes:
      - .:/app