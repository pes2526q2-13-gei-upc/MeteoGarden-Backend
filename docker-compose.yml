volumes:
  pgdata:

services:
  pg:
    image: postgres:16-alpine
    container_name: meteogarden_pg
    restart: unless-stopped
    env_file:
      - .postgres.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meteogarden_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteogarden_api
    restart: unless-stopped
    ports:
      - "18080:8000"
    env_file:
      - .django.env
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./firebase-key.json:/app/firebase-key.json

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteogarden_worker
    command: celery -A config worker -l info
    depends_on:
      - api
      - redis
    volumes:
      - .:/app
      - ./firebase-key.json:/app/firebase-key.json
    env_file:
      - .django.env

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meteogarden_beat
    command: celery -A config beat -l info
    depends_on:
      - api
      - redis
    volumes:
      - .:/app
      - ./firebase-key.json:/app/firebase-key.json
    env_file:
      - .django.env