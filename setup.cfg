[flake8]
max-line-length = 88

extend-ignore =
    E203,
    E266,
    E501,
    W503,

exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    */staticfiles/*,
    */media/*,
    .mypy_cache,
    .pytest_cache,
    */tests/*,
    **/tests/**,
    build,
    dist,
    *.egg-info

[isort]
profile = black
line_length = 88